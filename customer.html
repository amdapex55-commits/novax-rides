<!DOCTYPE html>
<html lang="en" data-app="customer">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#ffffff"/>
<title>Nova Go Bike — Book a bike in Karachi</title>
<meta name="description" content="Book a bike across Karachi. Fixed fare shown before you book, verified riders, pay cash."/>
<link rel="icon" type="image/svg+xml" href="favicon.svg"/>
<!-- iOS has no manifest support worth the name: without these three,
     "Add to Home Screen" produces a bookmark that opens in Safari WITH the
     address bar, which is not an app and does not feel like one. Android
     reads the manifest and needs none of this; iOS reads none of the
     manifest and needs all of it. -->
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<!-- black-translucent lets the app paint under the status bar, which is why
     every view already accounts for --safe-top. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Nova Go"/>
<link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png"/>
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png"/>
<link rel="manifest" href="manifest.customer.json"/>
<!-- Self-hosted Inter + Sora (css/fonts.css). No third-party origin in the
     critical path: no extra DNS + TLS before text can render, and no
     dependency on Google being reachable. -->
<link rel="preload" as="font" type="font/woff2" href="fonts/inter-var-latin.woff2" crossorigin/>
<link rel="preload" as="font" type="font/woff2" href="fonts/sora-var-latin.woff2" crossorigin/>
<link rel="stylesheet" href="css/fonts.css"/>
<link rel="stylesheet" href="css/brand.css"/>
<link rel="stylesheet" href="css/tokens.css"/>
<link rel="stylesheet" href="css/base.css"/>
<link rel="stylesheet" href="css/components.css"/>
<link rel="stylesheet" href="css/animations.css"/>
<link rel="stylesheet" href="css/premium.css"/>
<link rel="stylesheet" href="css/market.css"/>
<script>
  // Which of the four Nova Go apps this page is. Read by js/appMode.js before
  // anything else boots — it decides the routes, the nav, the signup role and
  // the entire visible surface. See js/appMode.js for the full explanation.
  window.NOVAGO_APP = "customer";

  /* THEME + LANGUAGE, BEFORE FIRST PAINT.
     Inlined rather than imported because js/app.js is a deferred module: by
     the time it runs the browser has already painted a white screen, so a
     dark-mode user sees a flash of white on every single app open. Reading
     two localStorage keys here costs under a millisecond and removes it.
     The real modules (js/theme.js, js/i18n.js) own everything after boot;
     this only has to agree with them on the storage keys and attributes. */

  /* CLICKJACKING. Nothing in Nova Go should render inside someone else's
     frame — the thing an attacker would overlay is a booking confirmation or
     a cancel button, both of which cost a real person money in a cash market.
     The proper control is a frame-ancestors response header, which a static
     host cannot send (see scripts/deploy-public.js); this is the fallback
     that works without one. */
  if (window.top !== window.self) { try { window.top.location = window.self.location; } catch (e) { document.documentElement.style.display = "none"; } }
  (function () {
    try {
      var app = window.NOVAGO_APP;
      var mode = localStorage.getItem("novago.theme");
      if (mode !== "light" && mode !== "dark" && mode !== "system") {
        /* Drivers ride at night with the phone on the handlebars — see the
           header of js/theme.js. */
        mode = app === "driver" ? "dark" : "system";
      }
      if (mode !== "system") document.documentElement.setAttribute("data-theme", mode);
      var dark = mode === "dark" || (mode === "system" &&
        window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.style.colorScheme = dark ? "dark" : "light";
      var mt = document.querySelector('meta[name="theme-color"]:not([media])');
      if (mt) mt.setAttribute("content", dark ? "#100d16" : "#ffffff");

      var lang = localStorage.getItem("novago.lang");
      if (lang !== "en" && lang !== "ur") lang = /^ur\b/i.test(navigator.language || "") ? "ur" : "en";
      document.documentElement.setAttribute("lang", lang);
      document.documentElement.setAttribute("dir", lang === "ur" ? "rtl" : "ltr");
      if (lang === "ur") document.documentElement.classList.add("nx-urdu");
    } catch (e) { /* storage blocked: light + English is a fine fallback */ }
  })();
</script>
<!-- Sentry (error reporting).
     Loaded from Sentry's CDN and async, so it never blocks first paint. If it
     fails to load — blocked, offline, CDN down — the app is completely
     unaffected; we lose visibility, not function. That's a different trade
     from socket.io and the fonts, which are vendored precisely because the
     product breaks without them.

     sentryOnLoad runs before init, and is where the privacy rules live. This
     app handles phone numbers, OTP codes and live coordinates, none of which
     have any business leaving the country to debug a stack trace. -->
<script>
  window.sentryOnLoad = function () {
    Sentry.init({
      environment: location.hostname === "localhost" ? "development" : "production",
      tracesSampleRate: 0.1,
      sendDefaultPii: false,

      // Strip location and identity out of captured URLs.
      //
      // Coordinates were covered; free-text place names were not. A failed
      // geocode sends ?q=<whatever the customer typed>, and "House 12,
      // Street 4, Gulshan" identifies someone far more precisely than a
      // lat/lng ever does. Geocoding is also the request most likely to
      // fail, so it was the one most likely to be captured.
      beforeBreadcrumb: function (crumb) {
        if (crumb.data && typeof crumb.data.url === "string") {
          crumb.data.url = crumb.data.url.replace(
            /([?&])(lat|lng|phone|code|token|q|query|search|address|pickup|dropoff|from|to)=[^&]*/gi,
            "$1$2=[redacted]"
          );
        }
        // Console breadcrumbs are noise here and can echo anything a view
        // logged, including an API payload.
        if (crumb.category === "console") return null;
        return crumb;
      },

      beforeSend: function (event) {
        if (event.request && typeof event.request.url === "string") {
          event.request.url = event.request.url.replace(
            /([?&])(lat|lng|phone|code|token|q|query|search|address|pickup|dropoff|from|to)=[^&]*/gi,
            "$1$2=[redacted]"
          );
        }
        return event;
      },

      ignoreErrors: [
        // A phone losing signal mid-request is normal in Karachi, not an
        // incident. Alerting on it teaches everyone to ignore Sentry.
        "Network request failed",
        "Failed to fetch",
        "NetworkError",
        "AbortError",
        // Browser extensions injecting into the page.
        "ResizeObserver loop limit exceeded",
      ],
    });
  };
</script>
<script
  src="https://js.sentry-cdn.com/442644e14b6db81bb4e2760698f85120.min.js"
  crossorigin="anonymous"
></script>
<!-- Mapbox token. Gitignored (see js/map-token.example.js) because GitHub's
     push protection rejects Mapbox tokens in a repo — once one is in history
     it stays there, rotated or not. Absent, the app falls back to the free
     basemap and every screen still works. -->
<script src="js/map-token.js" onerror="void 0"></script>
</head>
<body>
<style>
  /* BOOT SPLASH — "BAS NOVA KRO."
     ------------------------------------------------------------------
     Inlined, not linked: it must paint on the FIRST frame. An external
     stylesheet is exactly the round trip that makes a splash arrive late,
     flash, and look worse than no splash at all. Removed by js/app.js.

     THE IDEA. A nova is a star that suddenly brightens — but this is a
     BIKE company, so the light has to travel before it arrives. A
     headlight streaks in along a curve, the way a route draws itself on
     a map, and where it stops it detonates into the mark. The bolt is
     not "drawn in" stroke by stroke, which is the move every generated
     splash makes; it is STRUCK, revealed by the flash that arrives with
     it. Then the wordmark, then the line we actually want repeated.

     Rings fire ONCE, as a shockwave off that flash. Nothing here loops:
     a looping pulse says "waiting", and this screen is not a wait, it is
     an entrance — the shell behind it is interactive in about 100ms.

     Everything animates transform and opacity only, so it stays on the
     compositor and cannot cost a layout on a cheap phone.
     ------------------------------------------------------------------ */
  #nxSplash{position:fixed;inset:0;z-index:9999;overflow:hidden;
    display:grid;place-items:center;
    /* Off-centre light source: a flat radial reads as a backdrop, an
       off-centre one reads as a room with something bright in it. */
    background:radial-gradient(125% 95% at 50% 34%,#8b5cf6 0%,#6d28d9 38%,#4c1d95 68%,#2a0d5e 100%);
    transition:opacity .5s cubic-bezier(.4,0,.2,1),visibility .5s}
  #nxSplash.is-done{opacity:0;visibility:hidden;pointer-events:none}

  /* The city, barely there. Two hairline gradients drifting slowly, so the
     background is not a dead wash behind the mark. */
  #nxSplash .nxs-grid{position:absolute;inset:-20%;opacity:.05;
    background-image:linear-gradient(rgba(255,255,255,.7) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.7) 1px,transparent 1px);
    background-size:72px 72px;
    -webkit-mask:radial-gradient(ellipse at 50% 42%,#000 0%,transparent 58%);
    mask:radial-gradient(ellipse at 50% 42%,#000 0%,transparent 58%);
    animation:nxs-drift 9s linear infinite}
  @keyframes nxs-drift{to{transform:translate3d(72px,72px,0)}}

  #nxSplash .nxs-stage{position:relative;display:flex;flex-direction:column;
    align-items:center;width:min(80vw,340px)}
  #nxSplash .nxs-markwrap{position:relative;display:grid;place-items:center;
    width:132px;height:132px}

  /* THE HEADLIGHT. A streak with a hot head, travelling left to right and
     decelerating hard into the centre — the deceleration is what makes it
     read as arriving somewhere rather than passing through. */
  #nxSplash .nxs-trail{position:absolute;left:50%;top:50%;width:190px;height:3px;
    border-radius:99px;transform-origin:100% 50%;
    background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.05) 30%,
      rgba(255,255,255,.55) 78%,#fff 100%);
    box-shadow:0 0 22px 3px rgba(255,255,255,.4);
    opacity:0;animation:nxs-streak .82s cubic-bezier(.16,.9,.24,1) .06s forwards}
  @keyframes nxs-streak{
    0%{opacity:0;transform:translate(-260px,-50%) scaleX(.25) rotate(-9deg)}
    22%{opacity:1}
    72%{opacity:1;transform:translate(-50%,-50%) scaleX(1) rotate(0deg)}
    100%{opacity:0;transform:translate(-50%,-50%) scaleX(.06) rotate(0deg)}}

  /* THE NOVA. One frame of pure light where the streak stops. */
  #nxSplash .nxs-bloom{position:absolute;width:150px;height:150px;border-radius:50%;
    background:radial-gradient(circle,#fff 0%,rgba(255,255,255,.75) 28%,rgba(196,181,253,.28) 52%,transparent 72%);
    opacity:0;transform:scale(.2);
    animation:nxs-bloom .62s cubic-bezier(.2,.8,.3,1) .58s forwards}
  @keyframes nxs-bloom{0%{opacity:0;transform:scale(.2)}
    18%{opacity:1;transform:scale(.92)}100%{opacity:0;transform:scale(1.7)}}

  /* Shockwave. Twice, not forever. */
  #nxSplash .nxs-ring{position:absolute;width:104px;height:104px;border-radius:50%;
    border:1.5px solid rgba(255,255,255,.55);opacity:0;
    animation:nxs-wave 1.1s cubic-bezier(.16,.8,.28,1) .64s forwards}
  #nxSplash .nxs-ring:nth-of-type(2){animation-delay:.76s;
    border-color:rgba(196,181,253,.45)}
  @keyframes nxs-wave{0%{transform:scale(.5);opacity:.75}
    60%{opacity:.16}100%{transform:scale(2.35);opacity:0}}

  /* THE MARK. Struck, not drawn: it arrives already whole, slightly
     overshooting, with the flash still on it. */
  #nxSplash svg{position:relative;width:88px;height:88px;
    filter:drop-shadow(0 10px 26px rgba(20,0,60,.45));
    opacity:0;transform:scale(.55);
    animation:nxs-strike .66s cubic-bezier(.2,1.5,.35,1) .6s forwards}
  @keyframes nxs-strike{0%{opacity:0;transform:scale(.55)}
    45%{opacity:1}100%{opacity:1;transform:scale(1)}}

  #nxSplash .nxs-words{text-align:center;width:100%;margin-top:10px}
  /* Letter-spacing settling from wide to normal reads as "coming into
     focus" and costs nothing. */
  #nxSplash .nxs-mark{display:block;font-family:Sora,Inter,system-ui,sans-serif;
    font-size:18px;font-weight:800;color:#fff;opacity:0;
    letter-spacing:.5em;text-indent:.5em;
    animation:nxs-settle .6s cubic-bezier(.16,1,.3,1) .98s forwards}
  @keyframes nxs-settle{to{opacity:1;letter-spacing:.24em}}

  /* The payoff. Gold, heavier than the wordmark above it, and it LANDS —
     a short overshoot rather than a fade, because this is the line we
     want people to repeat. */
  #nxSplash .nxs-tag{display:block;margin-top:11px;
    font-family:Sora,Inter,system-ui,sans-serif;
    font-size:clamp(20px,6vw,27px);font-weight:800;letter-spacing:-.015em;
    background:linear-gradient(180deg,#fde68a 0%,#fbbf24 55%,#f59e0b 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    opacity:0;transform:translate3d(0,14px,0) scale(.94);
    animation:nxs-land .55s cubic-bezier(.18,1.35,.32,1) 1.25s forwards}
  @keyframes nxs-land{to{opacity:1;transform:none}}

  /* Vestibular safety: the finished frame, immediately, with nothing
     travelling or scaling. */
  @media (prefers-reduced-motion:reduce){
    #nxSplash .nxs-grid,#nxSplash .nxs-trail,
    #nxSplash .nxs-bloom,#nxSplash .nxs-ring{animation:none;opacity:0}
    #nxSplash svg{animation:none;opacity:1;transform:none}
    #nxSplash .nxs-mark{animation:none;opacity:1;letter-spacing:.24em}
    #nxSplash .nxs-tag{animation:none;opacity:1;transform:none}
  }
</style>
<div id="nxSplash" role="status" aria-label="Nova Go is starting">
  <span class="nxs-grid" aria-hidden="true"></span>
  <div class="nxs-stage">
    <span class="nxs-markwrap" aria-hidden="true">
      <span class="nxs-trail"></span>
      <span class="nxs-bloom"></span>
      <span class="nxs-ring"></span><span class="nxs-ring"></span>
      <svg viewBox="0 0 64 64">
        <path d="M36 8 18 36h12l-2 20 18-28H34l2-20z" fill="#fff"
              stroke="#fff" stroke-width="2.5"
              stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
    </span>
    <span class="nxs-words">
      <span class="nxs-mark">NOVA GO</span>
      <span class="nxs-tag">BAS NOVA KRO.</span>
    </span>
  </div>
</div>
<div id="app-root"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
