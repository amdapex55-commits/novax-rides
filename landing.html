<!--
  landing.html was the original four-service marketing page ("Rides, Food,
  Parcels & Errands"). index.html replaced it and is now the real, bike-focused
  landing page.

  Deleting this file outright would 404 any link already shared, so it
  redirects instead. Leaving the old copy live was the actual danger: two
  public pages telling different stories, one of them advertising three
  services that cannot take an order.

  Safe to delete entirely once you're confident nothing links here.
-->
<meta http-equiv="refresh" content="0; url=index.html"/>
<link rel="canonical" href="index.html"/>
<!-- Don't let search engines index a redirect stub. -->
<meta name="robots" content="noindex, follow"/>
<title>Nova X Bike — Bike rides across Karachi</title>
<script>location.replace("index.html");</script>
<style>
  body {
    margin: 0; min-height: 100vh;

    text-align: center; padding: 24px;
  }

</style>
</head>
