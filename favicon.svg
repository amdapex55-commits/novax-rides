<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Nova X mark: the bolt, on the brand emerald. SVG so it stays crisp at
       every size a browser tab, bookmark bar or home screen asks for, with
       no PNG export step in the build. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12b673"/>
      <stop offset="1" stop-color="#0b8a54"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#g)"/>
  <path d="M36 8 18 36h12l-2 20 18-28H34l2-20z"
        fill="#ffffff" stroke="#ffffff" stroke-width="2.5"
        stroke-linejoin="round" stroke-linecap="round"/>
</svg>
